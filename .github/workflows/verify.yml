name: verify

# The equivalence suite runs on CPU and, with tests/offline_vlm_cache.py, needs no
# network beyond the package install - so it can gate every push.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # lerobot 0.5.x requires >= 3.12

      - name: Install
        # The same two commands the README documents - no CI-only install path, so a
        # green run means the documented setup works.
        run: |
          python -m pip install --upgrade pip
          pip install "lerobot[smolvla]" "transformers>=5.3,<5.4"
          python -c "import torch, transformers, lerobot; print('torch', torch.__version__, '| transformers', transformers.__version__)"

      - name: Build the weights-free SmolVLM2 cache
        run: python tests/offline_vlm_cache.py

      - name: Equivalence + smoke checks
        env:
          HF_HOME: ${{ github.workspace }}/.hf_offline
          HF_HUB_OFFLINE: "1"
        run: |
          python tests/test_lightweight.py
          python tests/test_batched_vision.py
          python smolvla_fast_dct.py
          python benchmark.py --random --device cpu --iters 3
